# Builds and tests Aevalsistant.exe on Windows and Aevalsistant.app on macOS for every push and
# pull request. Pushing a tag such as v1.3.0 also publishes a GitHub release with both downloads:
# Aevalsistant.exe and Aevalsistant-mac.zip. The tag must match <Version> in Aevalsistant.csproj,
# and CHANGELOG.md must have a section for it. Installed copies pick the release up on their next
# update check.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = (Select-Xml -Path Aevalsistant.csproj -XPath "//Version").Node.InnerText
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "<Version> in Aevalsistant.csproj is '$v'; expected major.minor.patch" }
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -ne "v$v") { throw "Tag $env:REF_NAME does not match <Version>$v</Version> in Aevalsistant.csproj" }
            if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) { throw "CHANGELOG.md has no '## [$v]' section" }
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Aevalsistant.csproj -c Release

      - name: Test
        shell: pwsh
        run: |
          dotnet build tests/Aevalsistant.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force preview | Out-Null
          & tests/bin/Release/net48/Aevalsistant.Tests.exe preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload card renders
        uses: actions/upload-artifact@v7
        with:
          name: toast-renders
          path: preview/*.png

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: Aevalsistant-${{ steps.version.outputs.value }}
          path: bin/Release/net48/Aevalsistant.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          echo "::add-matcher::.github/swift-matcher.json"
          bash mac/build.sh

      - name: Test
        run: bash mac/test.sh preview-mac

      - name: Run the app
        run: bash mac/smoke.sh

      - name: Upload card and settings renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-renders
          path: preview-mac/*.png
          if-no-files-found: ignore

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Aevalsistant-mac
          path: mac/build/Aevalsistant-mac.zip
          if-no-files-found: error

  # Publishes the exe and the app the build jobs tested, not rebuilds.
  release:
    if: github.ref_type == 'tag'
    needs: [build, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Aevalsistant-${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@v8
        with:
          name: Aevalsistant-mac

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha=$(sha256sum Aevalsistant.exe | cut -d' ' -f1)
          macsha=$(sha256sum Aevalsistant-mac.zip | cut -d' ' -f1)
          awk -v head="## [$VERSION]" '
            index($0, "## [") == 1 { if (on) exit; on = index($0, head) == 1; next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Download

          **Windows:** download **Aevalsistant.exe** below and run it. It needs Windows 10 or 11 and
          nothing else. The exe is not code-signed yet, so Windows may say "Windows protected your
          PC" the first time. Choose **More info**, then **Run anyway**.

          **Mac:** download **Aevalsistant-mac.zip** below, open it, and open Aevalsistant. It needs
          macOS 13 or later, on Apple silicon or Intel. The app is not notarized yet, so macOS says it
          cannot check it the first time: open System Settings, Privacy & Security, and choose
          **Open Anyway** next to Aevalsistant.

          Copies installed from an earlier release update themselves within six hours.

          - SHA-256 of Aevalsistant.exe: \`$sha\`
          - SHA-256 of Aevalsistant-mac.zip: \`$macsha\`
          EOF
          gh release create "$TAG" Aevalsistant.exe Aevalsistant-mac.zip --verify-tag --title "Aevalsistant $VERSION" --notes-file notes.md
