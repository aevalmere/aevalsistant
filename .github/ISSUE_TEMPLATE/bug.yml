name: Bug report
description: Something is missing, wrong, or broken.
body:
  - type: input
    id: version
    attributes:
      label: Aevalsistant version
      description: Shown at the top of the tray menu.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Copilot CLI
        - Cursor
        - Windsurf
        - OpenCode
        - Claude desktop chat
        - ChatGPT desktop
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Where the agent runs, and its version
      placeholder: "Claude Code 2.1 in Windows Terminal, PowerShell"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
